<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TCG Store</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#" aria-label="TCG Store home">
          <span class="brand-mark" aria-hidden="true">TCG</span>
          <span class="brand-name">TCG Store</span>
        </a>
        <button class="admin-toggle" id="adminToggle" type="button" aria-controls="adminPanel" aria-expanded="false">
          Admin
        </button>
      </header>

      <main>
        <section class="storefront" aria-labelledby="storeHeading">
          <div class="store-copy">
            <p class="eyebrow">Online TCG Store</p>
            <h1 id="storeHeading">Featured Products</h1>
            <p>Simple storefront placeholder ready for your name, logo, and final product range.</p>
          </div>

          <div class="product-grid" id="productGrid" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div class="panel-overlay" id="panelOverlay" hidden></div>

    <aside class="admin-panel" id="adminPanel" aria-hidden="true" aria-labelledby="adminTitle">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Store Admin</p>
          <h2 id="adminTitle">Manage Products</h2>
        </div>
        <button class="icon-button" id="closePanel" type="button" aria-label="Close admin panel">x</button>
      </div>

      <form class="login-form" id="loginForm">
        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="adminPassword" type="password" autocomplete="current-password" required>
        <p class="form-error" id="loginError" role="alert"></p>
        <button class="primary-button" type="submit">Sign in</button>
      </form>

      <form class="editor-form" id="editorForm" hidden>
        <div class="editor-list" id="editorList"></div>

        <div class="editor-actions">
          <button class="secondary-button" id="addProduct" type="button">+ Add item</button>
          <button class="primary-button" type="submit">Save changes</button>
          <button class="plain-button" id="resetProducts" type="button">Reset</button>
          <button class="plain-button" id="logoutAdmin" type="button">Sign out</button>
        </div>
      </form>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js"></script>
  </body>
</html>
